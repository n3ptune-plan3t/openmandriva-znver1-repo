name: Build OpenMandriva package

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Package name(s) to build, space- or comma-separated (each must match specs/<name>/<name>.spec)'
        required: true

# Every run — regardless of how many packages it builds — reads,
# merges into, and republishes the single shared repo-rpm-znver1 release.
# Without a shared concurrency group, two separate dispatches (e.g.
# building libtracefs, then powertop, without waiting for the first
# to finish) can run in parallel containers and race on that
# read-modify-write, so a later build can silently miss a package
# an earlier, still-in-flight build hasn't published yet.
# cancel-in-progress is false so runs queue rather than one killing
# the other mid-publish.
concurrency:
  group: oma-znver1-repo-build
  cancel-in-progress: false

# RPMs, per-package releases and the repodata (gh-pages) are published to a
# separate repository so this one stays code-only. Needs the RELEASE_TOKEN
# secret: a PAT with write access to that repo (GITHUB_TOKEN is limited to
# this repo). Override the target with the RELEASE_REPO repository variable.
env:
  RELEASE_REPO: ${{ vars.RELEASE_REPO || format('{0}/oma-znver1-rpms', github.repository_owner) }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      image: ${{ steps.img.outputs.image }}
      image_exists: ${{ steps.img.outputs.exists }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release repository exists
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN}" ]; then
            echo "ERROR: secret RELEASE_TOKEN is not set (PAT with write access to $RELEASE_REPO)" >&2
            exit 1
          fi
          if gh repo view "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "Release repo $RELEASE_REPO exists"
          else
            echo "Creating release repo $RELEASE_REPO"
            gh repo create "$RELEASE_REPO" --public --add-readme \
              --description "Binary RPM repository (znver1) built by ${{ github.repository }}"
          fi

      - name: Check for builder image
        id: img
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/oma-znver1-builder:latest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Builder image not found — it will be created first"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package matrix from input
        id: set
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          matrix=$(printf '%s' "$PACKAGES" |
            tr ',' ' ' |
            xargs -n1 |
            jq -R . |
            jq -sc '{package: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # First run only: create the pre-synced builder image. After that the
  # weekly build-image.yml schedule keeps it fresh.
  image:
    needs: plan
    if: needs.plan.outputs.image_exists != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml

  build:
    needs: [plan, image]
    # `image` is skipped whenever the image already exists, which would
    # otherwise skip this job too.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
      # Builds share and publish to the same repo-rpm-znver1 release below;
      # running them one at a time avoids two jobs racing to
      # upload/delete assets on that shared release.
      max-parallel: 1
      fail-fast: false

    container:
      image: ${{ needs.plan.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --platform linux/amd64 --privileged

    steps:
      # build.sh only needs itself and this package's spec directory.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /build.sh
            /specs/${{ matrix.package }}/
          sparse-checkout-cone-mode: false

      - name: Build package
        run: sh build.sh
        env:
          PKG: ${{ matrix.package }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Delete previous release for this package
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release delete "${{ matrix.package }}" \
            --yes \
            --cleanup-tag \
            --repo "$RELEASE_REPO" || true

      - name: Publish per-package release
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ matrix.package }}
          files: out/*.rpm

      # One asset listing per run (was one `gh release view` per RPM in the
      # whole repo). Deletes every .rpm asset that dedup dropped from merged/
      # (older versions of any package) and, in the same pass, the legacy
      # metadata assets from before repodata moved to gh-pages.
      - name: Prune stale assets from the rolling repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          ls merged | grep -E '\.rpm$' | sort > keep.txt
          gh release view repo-rpm-znver1 \
              --repo "$RELEASE_REPO" \
              --json assets --jq '.assets[].name' 2>/dev/null | sort > have.txt || true
          {
            comm -13 keep.txt have.txt | grep -E '\.rpm$' || true
            grep -E '(^repomd\.xml|-(primary|filelists|other)\.(xml|sqlite)(\.(gz|zst|bz2|xz))?)$' have.txt || true
          } | sort -u | tee prune.txt
          xargs -r -P 8 -I{} gh release delete-asset repo-rpm-znver1 "{}" \
              --yes --repo "$RELEASE_REPO" < prune.txt || true
          rm -f keep.txt have.txt prune.txt

      - name: Publish rolling repo release (RPMs only)
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: repo-rpm-znver1
          name: "Personal repo snapshot (RPM, znver1)"
          # Only the RPMs from this build: everything else in merged/ was
          # downloaded from this very release and is already there.
          files: out/*.rpm

      # Release assets are flat, so dnf cannot read repodata/ from the
      # release. Serve it from GitHub Pages (gh-pages branch) instead;
      # the metadata's xml:base points back at the release for the RPMs.
      - name: Publish repodata to gh-pages
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pages=$(mktemp -d)
          cp -r merged/repodata "$pages/repodata"
          touch "$pages/.nojekyll"
          cd "$pages"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update repodata (${{ matrix.package }})"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git"
          git push -f origin gh-pages

      - name: Upload built package
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.package }}
          path: out/
          compression-level: 0
          if-no-files-found: error
